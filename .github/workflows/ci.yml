name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check sparclur test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      # The API reference imports every bundled optional parser adapter.
      - run: python -m pip install -e '.[docs,dev]'
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs/source /tmp/sparclur-docs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Audit resolved dependencies
        run: pip-audit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # MuPDF's parser adapter uses the mutool command for tracing.  The
      # report integration test intentionally exercises it alongside PDFium.
      - run: sudo apt-get update && sudo apt-get install --yes mupdf-tools
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel resources
        working-directory: /tmp
        run: >-
          python -c "from sparclur.parsers.present_parsers import min_pdf;
          from sparclur.utils import get_config; assert min_pdf and get_config() == {}"
